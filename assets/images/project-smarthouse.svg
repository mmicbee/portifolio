<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgHouse)"/>
  <!-- Skyline / Modern House Outline -->
  <g fill="none" stroke="#FF6B2B" stroke-width="2" opacity="0.6">
    <path d="M 220,320 L 220,180 L 320,120 L 420,180 L 420,320 Z"/>
    <path d="M 420,320 L 420,200 L 580,200 L 580,320 Z"/>
    <rect x="250" y="200" width="50" height="60" rx="4"/>
    <rect x="340" y="200" width="50" height="60" rx="4"/>
    <rect x="460" y="230" width="80" height="50" rx="4"/>
  </g>
  <!-- Card Header -->
  <rect x="90" y="50" width="620" height="90" rx="14" fill="#0c0a09" fill-opacity="0.8" stroke="#44403c" stroke-width="1"/>
  <text x="120" y="90" fill="#fafaf9" font-family="sans-serif" font-size="22" font-weight="bold">Smart House Hunt — Kenya</text>
  <text x="120" y="118" fill="#a8a29e" font-family="sans-serif" font-size="13">AI-powered property matching engine solving rental friction in Nairobi &amp; Kisumu</text>
  <rect x="550" y="70" width="130" height="34" rx="8" fill="#FF6B2B"/>
  <text x="615" y="92" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GO ENGINE</text>
  <!-- Map Pin & Status -->
  <circle cx="320" cy="120" r="16" fill="#FF6B2B" fill-opacity="0.3"/>
  <circle cx="320" cy="120" r="6" fill="#FF6B2B"/>
  <!-- Key stats pill -->
  <rect x="260" y="345" width="280" height="42" rx="21" fill="#1c1917" stroke="#FF6B2B" stroke-width="1.2"/>
  <text x="400" y="371" fill="#fed7aa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Locality Matching • Price Indexing • Go API</text>
</svg>