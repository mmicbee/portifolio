<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIdinex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgIdinex)"/>
  <!-- Floating Idea Cards Mockup -->
  <g transform="translate(60, 60)">
    <!-- Main Card -->
    <rect x="0" y="0" width="380" height="280" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="24" rx="12" fill="#FF6B2B" fill-opacity="0.2"/>
    <text x="59" y="40" fill="#FF8F5C" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GO REST</text>
    <text x="24" y="85" fill="#f4f4f5" font-family="sans-serif" font-size="20" font-weight="bold">Collaborative Idea Catalog</text>
    <text x="24" y="115" fill="#a1a1aa" font-family="sans-serif" font-size="13">Modular CRUD service layer with session-auth</text>
    <!-- Strength meter bar -->
    <text x="24" y="160" fill="#71717a" font-family="sans-serif" font-size="11" font-weight="600">AUTH &amp; SECURITY PROTOCOL</text>
    <rect x="24" y="175" width="332" height="8" rx="4" fill="#3f3f46"/>
    <rect x="24" y="175" width="280" height="8" rx="4" fill="url(#orangeGrad)"/>
    <!-- Tags -->
    <rect x="24" y="215" width="95" height="28" rx="8" fill="#18181b"/>
    <text x="71" y="233" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">ES Modules</text>
    <rect x="130" y="215" width="95" height="28" rx="8" fill="#18181b"/>
    <text x="177" y="233" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">Sessions Auth</text>
  </g>
  <!-- Code Snippet Card Side -->
  <g transform="translate(470, 90)">
    <rect x="0" y="0" width="270" height="240" rx="16" fill="#1e1e24" stroke="#FF6B2B" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="42" cy="24" r="5" fill="#eab308"/>
    <circle cx="60" cy="24" r="5" fill="#22c55e"/>
    <text x="24" y="65" fill="#38bdf8" font-family="monospace" font-size="12">type Idea struct {</text>
    <text x="44" y="90" fill="#f4f4f5" font-family="monospace" font-size="12">ID int `json:"id"`</text>
    <text x="44" y="115" fill="#f4f4f5" font-family="monospace" font-size="12">Title string</text>
    <text x="44" y="140" fill="#f4f4f5" font-family="monospace" font-size="12">Score float64</text>
    <text x="24" y="165" fill="#38bdf8" font-family="monospace" font-size="12">}</text>
    <text x="24" y="195" fill="#10b981" font-family="monospace" font-size="12">// Go REST Backend</text>
  </g>
</svg>