<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAfri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c131f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgAfri)"/>
  <!-- Connecting network rings -->
  <circle cx="400" cy="225" r="160" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-dasharray="8 6"/>
  <circle cx="400" cy="225" r="110" fill="none" stroke="#FF6B2B" stroke-opacity="0.2" stroke-dasharray="6 4"/>
  <!-- Lightning Bolt Symbol -->
  <polygon points="415,80 345,215 395,215 365,340 455,190 405,190" fill="url(#boltGrad)"/>
  <!-- Cross Border Cards -->
  <rect x="80" y="160" width="190" height="110" rx="14" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <text x="100" y="195" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">ORIGIN: KENYA (KES)</text>
  <text x="100" y="230" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">15,000 KES</text>
  <text x="100" y="250" fill="#10b981" font-family="sans-serif" font-size="11">Instant Conversion</text>

  <rect x="530" y="160" width="190" height="110" rx="14" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <text x="550" y="195" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">DESTINATION: GHANA</text>
  <text x="550" y="230" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">1,820 GHS</text>
  <text x="550" y="250" fill="#f59e0b" font-family="sans-serif" font-size="11">Lightning Rail &lt; 2s</text>

  <text x="400" y="390" fill="#e0e7ff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AfriPay • Bitcoin Lightning Micro-Settlements</text>
  <text x="400" y="415" fill="#818cf8" font-family="sans-serif" font-size="12" text-anchor="middle">Low-cost cross-border African merchant payments built with Go</text>
</svg>